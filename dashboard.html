<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .box {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    input {
      padding: 10px;
      width: 60%;
      border-radius: 5px;
      border: none;
    }

    button {
      padding: 10px 15px;
      background: #22c55e;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
    }

    li {
      margin-bottom: 15px;
      background: #334155;
      padding: 10px;
      border-radius: 5px;
    }

    a {
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <h1>📊 Influencer Dashboard</h1>


  <div class="box">
  <h3>Overview</h3>
  <p>Total Clicks: <span id="totalClicks">0</span></p>
  <p>Total Influencers: <span id="totalInfluencers">0</span></p>
</div>

  <div class="box">
    <h3>Add Influencer</h3>
    <input type="text" id="name" placeholder="Enter influencer name">
    <button onclick="addInfluencer()">Add</button>
  </div>

  <div class="box">
    <h3>Influencers</h3>
    <ul id="list"></ul>
  </div>

  <script type="module" src="dashboard.js"></script>

</body>
</html>
