<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Influencer Tracking Dashboard</title>

  <link rel="stylesheet" href="style.css" />

</head>

<body>

  <div class="container">

    <!-- LOGO -->
    <div class="logo-box">

      <img
        src="https://cdn-icons-png.flaticon.com/512/3536/3536445.png"
        class="logo"
      />

    </div>

    <h1>
      Influencer Dashboard
    </h1>

    <button id="loginBtn">
        Login with Google
    </button>

    <!-- STATS -->
    <div class="stats-container">

      <div class="stats-card">

        <h2>Total Clicks</h2>

        <p id="totalClicks">0</p>

      </div>

      <div class="stats-card">

        <h2>Total Influencers</h2>

        <p id="totalInfluencers">0</p>

      </div>

    </div>

    <!-- SEARCH -->
    <div class="search-box">

      <input
        type="text"
        id="search"
        placeholder="Search influencer..."
      />

    </div>

    <!-- FORM -->
    <div class="form-card">

      <input
        type="text"
        id="name"
        placeholder="Influencer name"
      />

      <input
        type="text"
        id="phone"
        placeholder="WhatsApp number e.g 254712345678"
      />

      <button onclick="addInfluencer()">
        Add Influencer
      </button>

    </div>

    <!-- LIST -->
    <ul id="list"></ul>

  </div>

  <script type="module" src="dashboard.js"></script>

  <!-- POPUP MODAL -->
  <div id="popup" class="popup hidden">

    <div class="popup-content">

      <span id="closePopup" class="close-btn">
        &times;
      </span>

      <h2 id="popupName"></h2>

      <p id="popupPhone"></p>

      <a
        id="popupLink"
        target="_blank"
      >
        Open Referral Link
      </a>

    </div>

</div>

</body>

</html>
